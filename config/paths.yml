# Data and output locations. Relative paths are resolved from the repository root.
#
# Do not edit this file to point at data on your own machine. Instead copy
# config/paths.local.example.yml to config/paths.local.yml (git-ignored) and set
# only the entries that differ; it is merged over this file.

# Public GEO downloads (series matrices, platform annotations, GSE234379 betas,
# GSE204943 sample sheet and IDAT archive). Filled by scripts/00_download.
geo: data/geo

# GSE227919 supplementary files (expression matrix and sample annotation).
gse227919: data/geo/GSE227919

# GSE204943 processed objects. Stage 01 writes them here; a frozen copy from an
# earlier run can be used instead by pointing this entry at it. Expected layout:
#   crucial_objects/{beta.rds, pd.rds, ann_auto.rds}
#   results/{cell_type_proportions.csv, hypo_PMD_blocks.csv,
#            PMD_erosion_score_per_sample.csv, ZNF471_CpG_details.csv, CNV_segments_all.csv}
gse204943_objects: outputs/gse204943

# GSE204943 IDAT files (extracted from GSE204943_RAW.tar).
gse204943_idat: data/geo/GSE204943/idat

# Pilot EPIC v2 chip: IDAT directory (one sub-directory per Sentrix ID) and the
# GenomeStudio sample sheet. Not public; see data/README.md.
pilot_idat_dir: data/pilot/methylation/idat
pilot_sample_sheet: data/pilot/methylation/sample_sheet.csv

# Pilot bulk RNA-seq: kallisto outputs (kallisto/<library>/) and gene matrices
# (matrices/) are written here. FASTQ files are not stored (see scripts/05_pilot_rnaseq).
rnaseq: outputs/rnaseq

# kallisto index built from the GENCODE v50 transcriptome (scripts/05_pilot_rnaseq).
kallisto_index: data/reference/gencode_v50.kallisto.idx

# All analysis outputs (intermediate objects, tables, figures).
outputs: outputs
